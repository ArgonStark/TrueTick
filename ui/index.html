<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrueTick — tokenized stock fair price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   TrueTick UI

   Design intent: a financial data product must look trustworthy and legible,
   never flashy. Two rules drive every choice below.

   1. COLOUR IS SEMANTIC. The chrome is deliberately desaturated so that
      saturated colour means exactly one thing: something about the DATA.
      Green/red = deviation direction. Amber = this number is not trustworthy.
      That is why the brand accent is a muted slate-cyan rather than the amber
      the design system suggested -- an amber brand would collide with amber
      warnings and quietly destroy the signal.

   2. AN UNRELIABLE NUMBER GETS A DIFFERENT VISUAL LANGUAGE. Not a smaller
      label -- a different treatment entirely. A flagged price is dimmed,
      hairlined in amber, and its deviation is rendered in neutral amber rather
      than green/red, because green/red reads as a trustworthy market signal.
--------------------------------------------------------------------------- */

:root {
  /* ground */
  --bg:          #0B0F19;
  --surface:     #121826;
  --surface-2:   #171F30;
  --border:      #222D42;
  --border-soft: #1A2334;

  /* text */
  --text:        #F1F5F9;
  --text-mid:    #A9B6CA;
  --text-dim:    #6B7A92;

  /* accent: muted, non-competing with data colour */
  --accent:      #56C7D6;
  --accent-dim:  #1D3A44;

  /* data semantics -- the only saturated colours in the UI */
  --up:          #4ADE80;   /* trading above reference (premium) */
  --up-bg:       #10281B;
  --down:        #FB7185;   /* trading below reference (discount) */
  --down-bg:     #2B141C;
  --warn:        #F5A524;   /* flagged: do not trust this number */
  --warn-bg:     #2B2010;
  --warn-border: #6B4E14;

  --radius: 10px;
  --mono: 'Fira Code', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sans: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  /* 16px floor: readable-font-size rule */
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Numerals must align vertically down a price column or they cannot be
   compared at a glance -- the entire point of this screen. */
.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* focus-states rule: visible ring on every interactive element */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ header */

header {
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(180deg, #0D1320 0%, var(--bg) 100%);
}
.head-row {
  display: flex; align-items: baseline; gap: 14px;
  flex-wrap: wrap; padding: 22px 0 18px;
}
.brand {
  font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0;
}
.brand span { color: var(--accent); }
.tagline { color: var(--text-dim); font-size: 14px; margin: 0; }

/* liveness strip: the "this is not mocked" proof, always on screen */
.live {
  margin-left: auto; display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap; font-size: 12.5px; color: var(--text-mid);
}
.live-item { display: flex; align-items: center; gap: 6px; }
.live-item b { color: var(--text); font-weight: 500; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--up); flex: none;
  box-shadow: 0 0 0 3px rgba(74,222,128,0.15);
}
.dot.stale { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,165,36,0.15); }
.dot.dead  { background: var(--down); box-shadow: 0 0 0 3px rgba(251,113,133,0.15); }
@media (prefers-reduced-motion: no-preference) {
  .dot.pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.45 } }
}

/* ---------------------------------------------------------------- controls */

.controls {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; padding: 16px 0;
}
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  /* touch-target-size rule: >=44px tall on touch */
  min-height: 34px; padding: 6px 13px;
  background: var(--surface); color: var(--text-mid);
  border: 1px solid var(--border); border-radius: 999px;
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
}
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip[aria-pressed="true"] {
  background: var(--accent-dim); color: var(--accent);
  border-color: var(--accent);
}
@media (pointer: coarse) { .chip { min-height: 44px; padding: 10px 16px; } }

.btn {
  min-height: 34px; padding: 6px 14px;
  background: var(--surface); color: var(--text-mid);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: var(--sans); font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background 180ms ease, color 180ms ease;
}
.btn:hover { background: var(--surface-2); color: var(--text); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .btn.loading svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
}

/* -------------------------------------------------------------------- hero */

.hero { padding: 10px 0 4px; }

.ticker-line {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  margin-bottom: 4px;
}
.ticker-sym {
  font-size: 44px; font-weight: 700; letter-spacing: -0.03em;
  line-height: 1.05; margin: 0;
}
.ref-block { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ref-label { font-size: 13px; color: var(--text-dim); }
.ref-price { font-size: 25px; font-weight: 600; }
.ref-meta { font-size: 12.5px; color: var(--text-dim); }

.session {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 500; letter-spacing: 0.02em;
  border: 1px solid var(--border); color: var(--text-mid);
  background: var(--surface);
}
.session.open { color: var(--up); border-color: #1D5236; background: var(--up-bg); }

.hero-sub {
  color: var(--text-dim); font-size: 14px;
  margin: 6px 0 20px; max-width: 68ch;
}

/* ------------------------------------------------------------ issuer cards */

.cards {
  display: grid; gap: 14px; margin-bottom: 26px;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
}

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 16px;
  transition: border-color 180ms ease, background 180ms ease;
}
.card:hover { background: var(--surface-2); }

/* The quarantine treatment. A flagged card must not read as a price card. */
.card.flagged {
  border-color: var(--warn-border);
  background: linear-gradient(180deg, rgba(245,165,36,0.045) 0%, var(--surface) 60%);
}
.card.flagged::before {
  content: ''; position: absolute; left: 0; top: 12px; bottom: 12px;
  width: 3px; border-radius: 3px; background: var(--warn);
}

.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 10px; margin-bottom: 14px;
}
.issuer { font-size: 13px; color: var(--text-mid); font-weight: 500; }
.symbol {
  font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  margin-top: 1px;
}
.chain {
  font-size: 11px; color: var(--text-dim); margin-top: 3px;
  display: flex; align-items: center; gap: 5px;
}

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 6px; flex: none;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
}
.badge.flag { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
.badge.ok   { background: var(--up-bg); color: var(--up); border: 1px solid #1D5236; }
.badge svg { width: 12px; height: 12px; }

.price {
  font-size: 34px; font-weight: 600; letter-spacing: -0.02em;
  line-height: 1.1; margin-bottom: 2px;
}
/* Dimmed, not hidden: the number stays auditable but stops looking authoritative. */
.card.flagged .price { color: var(--text-dim); font-weight: 500; }

.price.null { color: var(--text-dim); font-weight: 400; }

.dev {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 19px; font-weight: 600; margin-top: 8px;
}
.dev svg { width: 15px; height: 15px; }
.dev.up   { color: var(--up); }
.dev.down { color: var(--down); }
/* Flagged deviations are amber, NOT green/red -- green/red would imply a
   trustworthy directional signal, which is exactly what this is not. */
.dev.untrusted { color: var(--warn); }
.dev.null { color: var(--text-dim); font-size: 16px; font-weight: 400; }

.dev-note { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.card.flagged .dev-note { color: var(--warn); opacity: 0.85; }

.card-stats {
  display: flex; gap: 20px; flex-wrap: wrap;
  margin-top: 15px; padding-top: 13px;
  border-top: 1px solid var(--border-soft);
  font-size: 12.5px;
}
.stat-label { color: var(--text-dim); font-size: 11px; display: block; }
.stat-val { color: var(--text-mid); }

.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.flag {
  font-size: 11px; padding: 2px 8px; border-radius: 5px;
  background: var(--warn-bg); color: var(--warn);
  border: 1px solid var(--warn-border);
  cursor: help;
}
.flag.info {
  background: var(--surface-2); color: var(--text-dim); border-color: var(--border);
}

/* ------------------------------------------------------------------- table */

.section-head {
  display: flex; align-items: baseline; gap: 10px;
  margin: 28px 0 12px;
}
.section-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
.section-head p { font-size: 12.5px; color: var(--text-dim); margin: 0; }

/* Table Handling rule: horizontal scroll rather than a broken layout. */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 900px; }
thead th {
  text-align: left; padding: 11px 14px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--surface-2);
}
thead th.r, tbody td.r { text-align: right; }
tbody td {
  padding: 12px 14px; border-bottom: 1px solid var(--border-soft);
  vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 150ms ease; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.flagged { background: rgba(245,165,36,0.035); }
tbody tr.flagged:hover { background: rgba(245,165,36,0.06); }
td .sym { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
td .iss { font-size: 11.5px; color: var(--text-dim); }
.null-cell { color: var(--text-dim); cursor: help; }

/* ------------------------------------------------------------------- pools */

details.pools { margin-top: 12px; }
details.pools summary {
  cursor: pointer; font-size: 12px; color: var(--text-dim);
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 0;
}
details.pools summary::-webkit-details-marker { display: none; }
details.pools summary:hover { color: var(--text-mid); }
details.pools summary svg { width: 11px; height: 11px; transition: transform 180ms ease; }
details.pools[open] summary svg { transform: rotate(90deg); }
.pool-list { margin-top: 8px; font-size: 11.5px; }
.pool-row {
  display: flex; gap: 12px; padding: 5px 0;
  border-top: 1px solid var(--border-soft); color: var(--text-dim);
}
.pool-row .pair { font-family: var(--mono); color: var(--text-mid); min-width: 150px; }

/* --------------------------------------------------------- states / footer */

.state {
  padding: 46px 20px; text-align: center;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text-mid);
}
.state.error { border-color: #5A2733; background: var(--down-bg); color: #FFC7CF; }
.state code { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

/* content-jumping rule: reserve space so loading does not shift layout */
.skeleton { height: 176px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
@media (prefers-reduced-motion: no-preference) {
  .skeleton { animation: shimmer 1.5s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: 1 } 50% { opacity: 0.55 } }
}

footer {
  margin-top: 40px; padding: 20px 0 40px;
  border-top: 1px solid var(--border-soft);
  font-size: 12px; color: var(--text-dim);
}
footer a { color: var(--text-mid); }
.prov { display: flex; gap: 22px; flex-wrap: wrap; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

@media (max-width: 640px) {
  .ticker-sym { font-size: 34px; }
  .price { font-size: 28px; }
  .live { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <div>
        <h1 class="brand">True<span>Tick</span></h1>
        <p class="tagline">Fair price and deviation for tokenized stocks</p>
      </div>
      <div class="live" id="live" aria-live="polite">
        <span class="live-item"><span class="dot dead" id="liveDot"></span><span id="liveText">connecting…</span></span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Select ticker"></div>
    <button class="btn" id="refresh" type="button" style="margin-left:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
      <span id="refreshLabel">Refresh</span>
    </button>
  </div>

  <main class="hero">
    <div id="content">
      <div class="cards">
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="prov" id="prov">
      <span>On-chain: Uniswap v4 (Ethereum) via The Graph</span>
      <span>Reference: <span id="provRef">—</span></span>
      <span>Normalized schema — new issuers appear automatically</span>
    </div>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------------------
   Data layer.

   Everything renders from whatever the service returns. No issuer, chain or
   symbol is hardcoded anywhere below -- when the Base/Aerodrome adapter starts
   returning points, they appear in this table with no change to this file.
--------------------------------------------------------------------------- */

// Same-origin by default (the service serves this page). ?api= overrides.
const API = new URLSearchParams(location.search).get('api') || '';
const PREVIEW = new URLSearchParams(location.search).has('preview');

const el = (id) => document.getElementById(id);

let ticker = new URLSearchParams(location.search).get('ticker') || 'NVDA';
let lastFetchedAt = null;
let liveTimer = null;

/* --- formatting ---------------------------------------------------------- */

/* NULL-NEVER-ZERO, enforced at the last possible moment.
   A null price renders as an em dash with an explanation -- never $0, never a
   placeholder that could be mistaken for a real quote. */
function usd(v, dp = 2) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return null;
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function compactUsd(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return null;
  const n = Number(v);
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}
function pct(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return null;
  const n = Number(v);
  return (n >= 0 ? '+' : '') + n.toFixed(n >= 100 || n <= -100 ? 1 : 3) + '%';
}
/** Renders an unavailable value honestly. */
function nullCell(reason) {
  return '<span class="null-cell" title="' + esc(reason || 'unavailable') + '">—</span>';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function ago(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

/* --- caveat vocabulary ---------------------------------------------------
   Machine codes from the API become human labels here. Unknown codes fall
   through as-is rather than being dropped, so a new caveat added server-side
   still surfaces instead of silently vanishing. */
const CAVEATS = {
  'market-closed':      { label: 'US market closed', info: true,
                          why: 'The underlying stock is not trading. Tokenized stocks trade 24/7, so this deviation reflects news since the close, not an arbitrage.' },
  'thin-volume':        { label: 'Thin volume',
                          why: 'Almost nothing traded in these pools over the last two days, so the price is not enforced by real trading.' },
  'price-divergence':   { label: 'Price divergence',
                          why: 'Two independent on-chain price paths disagree by more than 1%, so at least one is unreliable.' },
  'phantom-liquidity':  { label: 'Phantom liquidity',
                          why: 'Capital is sitting in the pools but nothing has traded against it.' },
  'no-reference-price': { label: 'No reference price',
                          why: 'No real-world price was available to compare against, so deviation cannot be computed.' },
  'no-pools':           { label: 'No pools',
                          why: 'This token is indexed but has no liquidity pools.' },
  'indexing-errors':    { label: 'Indexing errors',
                          why: 'The subgraph reports indexing errors, so its data may be incomplete.' },
  'index-lagging':      { label: 'Index lagging',
                          why: 'The index is more than 5 minutes behind the chain head.' },
  'reference-stale':    { label: 'Reference stale',
                          why: 'The market is open but the reference quote is over 15 minutes old.' },
  'decimals-mismatch':  { label: 'Decimals mismatch',
                          why: 'Registry decimals disagree with the contract — a registry bug, not a market event.' },
  'preview-redacted':   { label: 'Preview (redacted)', info: true,
                          why: 'Free preview: prices are withheld, not zero.' },
};
function caveat(code) {
  return CAVEATS[code] || { label: code, why: 'Reported by the data service.' };
}

/* --- icons (SVG, never emoji) -------------------------------------------- */
const ICON = {
  up:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
};

/* --- fetch --------------------------------------------------------------- */

async function load(t) {
  ticker = t;
  renderChips();
  el('refresh').disabled = true;
  el('refresh').classList.add('loading');
  el('refreshLabel').textContent = 'Loading';

  const path = (PREVIEW ? '/preview/' : '/price/') + encodeURIComponent(t);
  try {
    const res = await fetch(API + path);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    render(body);
  } catch (e) {
    el('content').innerHTML =
      '<div class="state error"><strong>Could not load ' + esc(t) + '</strong><br>' +
      '<span style="font-size:13px">' + esc(e.message) + '</span><br><br>' +
      '<code>node service.mjs</code> must be running.</div>';
    setLive(null);
  } finally {
    el('refresh').disabled = false;
    el('refresh').classList.remove('loading');
    el('refreshLabel').textContent = 'Refresh';
  }
}

async function loadTickers() {
  try {
    const res = await fetch(API + '/tickers');
    const body = await res.json();
    window.__tickers = body.tickers || [];
  } catch {
    window.__tickers = [{ ticker }];
  }
  renderChips();
}

function renderChips() {
  const list = window.__tickers || [];
  el('chips').innerHTML = list.map((t) =>
    '<button class="chip" type="button" role="button" aria-pressed="' +
    (t.ticker === ticker) + '" data-t="' + esc(t.ticker) + '">' + esc(t.ticker) + '</button>'
  ).join('');
  el('chips').querySelectorAll('.chip').forEach((b) =>
    b.addEventListener('click', () => load(b.dataset.t))
  );
}

/* --- liveness ------------------------------------------------------------ */

function setLive(data) {
  clearInterval(liveTimer);
  if (!data) {
    el('liveDot').className = 'dot dead';
    el('liveText').textContent = 'service unreachable';
    return;
  }
  const p = data.points[0];
  const tick = () => {
    const age = p ? p.indexedLagSeconds + Math.floor((Date.now() - lastFetchedAt) / 1000) : null;
    const bits = [];
    if (p) {
      bits.push('<span class="live-item">block <b class="num">' + p.indexedBlock.toLocaleString('en-US') + '</b></span>');
      bits.push('<span class="live-item">lag <b class="num">' + age + 's</b></span>');
    }
    if (data.reference) {
      bits.push('<span class="live-item">ref <b>' + esc(data.reference.source) + '</b></span>');
    }
    // Green while the index is genuinely near the head; amber once it drifts.
    const cls = age === null ? 'dead' : age > 300 ? 'stale' : 'pulse';
    el('live').innerHTML =
      '<span class="live-item"><span class="dot ' + cls + '"></span>' +
      (age === null ? 'no data' : 'live') + '</span>' + bits.join('');
  };
  tick();
  liveTimer = setInterval(tick, 1000);
}

/* --- render -------------------------------------------------------------- */

function render(data) {
  lastFetchedAt = Date.now();
  const ref = data.reference;
  const refPrice = usd(data.referencePriceUsd);

  // Name the session in the language a trader uses, not the API's enum.
  const SESSION_LABEL = {
    regular: 'Market open',
    pre:     'Pre-market',
    post:    'After hours',
    closed:  'Market closed',
  };
  const sessionLabel = ref
    ? (SESSION_LABEL[ref.session] || 'Market closed')
    : 'No reference price';

  const head =
    '<div class="ticker-line">' +
      '<h2 class="ticker-sym">' + esc(data.ticker) + '</h2>' +
      '<div class="ref-block">' +
        '<span class="ref-label">Reference</span>' +
        '<span class="ref-price num">' + (refPrice || nullCell(data.referenceError || 'no reference price')) + '</span>' +
        '<span class="session' + (ref && ref.marketOpen ? ' open' : '') + '">' + esc(sessionLabel) + '</span>' +
        (ref ? '<span class="ref-meta">' + esc(ref.source) + ' · quoted ' + ago(ref.ageSeconds) + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<p class="hero-sub">The same stock, priced by ' + data.points.length +
    ' issuer' + (data.points.length === 1 ? '' : 's') +
    ' on-chain. Deviation is measured against the real-world reference price above.</p>';

  const cards = '<div class="cards">' + data.points.map(card).join('') + '</div>';

  const table =
    '<div class="section-head"><h2>Detail</h2>' +
    '<p>Every issuer read at the same indexed block</p></div>' +
    '<div class="table-wrap"><table>' +
      '<caption class="sr-only">Tokenized ' + esc(data.ticker) +
      ' prices and deviation by issuer</caption>' +
      '<thead><tr>' +
        '<th scope="col">Issuer</th>' +
        '<th scope="col">Chain</th>' +
        '<th scope="col" class="r">On-chain</th>' +
        '<th scope="col" class="r">Reference</th>' +
        '<th scope="col" class="r">Deviation</th>' +
        '<th scope="col" class="r">Pool TVL</th>' +
        '<th scope="col" class="r">24h volume</th>' +
        '<th scope="col">Status</th>' +
      '</tr></thead><tbody>' +
      data.points.map(row).join('') +
    '</tbody></table></div>';

  el('content').innerHTML = head + cards + table;
  el('provRef').textContent = ref ? ref.source : 'unavailable';
  setLive(data);

  el('content').querySelectorAll('details.pools').forEach((d) => {
    d.querySelector('summary').insertAdjacentHTML('afterbegin', ICON.chev);
  });
}

/** A single issuer card -- the three-second hero. */
function card(p) {
  const q = p.quality;
  const flagged = !q.priceReliable;
  const price = usd(p.priceUsd);
  const dev = pct(p.deviationPct);

  let devHtml;
  if (dev === null) {
    devHtml = '<div class="dev null">' + nullCell('deviation unavailable') + ' deviation</div>';
  } else {
    // Direction colour ONLY when the number is trustworthy.
    const cls = flagged ? 'untrusted' : (p.deviationPct >= 0 ? 'up' : 'down');
    const icon = flagged ? ICON.warn : (p.deviationPct >= 0 ? ICON.up : ICON.down);
    devHtml = '<div class="dev ' + cls + '">' + icon + '<span class="num">' + dev + '</span></div>';
  }

  const note = flagged
    ? 'Not a reliable price'
    : (q.deviationReliable ? 'vs reference, live' : 'vs last close');

  const badge = flagged
    ? '<span class="badge flag">' + ICON.warn + 'FLAGGED</span>'
    : '<span class="badge ok">' + ICON.ok + 'RELIABLE</span>';

  return '<article class="card' + (flagged ? ' flagged' : '') + '">' +
    '<div class="card-head"><div>' +
      '<div class="issuer">' + esc(p.issuer) + '</div>' +
      '<div class="symbol">' + esc(p.symbol) + '</div>' +
      '<div class="chain">' + esc(p.chain) + ' · ' + esc(p.tokenAddress.slice(0, 6)) + '…' + esc(p.tokenAddress.slice(-4)) + '</div>' +
    '</div>' + badge + '</div>' +
    '<div class="price num' + (price ? '' : ' null') + '">' +
      (price || nullCell('price unavailable — no usable on-chain price')) + '</div>' +
    devHtml +
    '<div class="dev-note">' + esc(note) + '</div>' +
    '<div class="card-stats">' +
      '<div><span class="stat-label">Pool TVL</span><span class="stat-val num">' +
        (compactUsd(p.poolTvlUsd) || nullCell('unavailable')) + '</span></div>' +
      '<div><span class="stat-label">24h volume</span><span class="stat-val num">' +
        (compactUsd(p.volume24hUsd) || nullCell('unavailable')) + '</span></div>' +
      '<div><span class="stat-label">Pools</span><span class="stat-val num">' + p.pools.length + '</span></div>' +
    '</div>' +
    flagList(q.caveats) +
    poolDetails(p) +
  '</article>';
}

function flagList(caveats) {
  if (!caveats || !caveats.length) return '';
  return '<div class="flags">' + caveats.map((c) => {
    const info = caveat(c);
    return '<span class="flag' + (info.info ? ' info' : '') + '" title="' + esc(info.why) + '">' +
      esc(info.label) + '</span>';
  }).join('') + '</div>';
}

/** Audit trail: the pools the price actually came from. */
function poolDetails(p) {
  const pools = (p.pools || []).filter((x) => x.tvlUsd > 0).slice(0, 4);
  if (!pools.length) return '';
  return '<details class="pools"><summary>Top pools (' + p.pools.length + ' total)</summary>' +
    '<div class="pool-list">' + pools.map((pool) =>
      '<div class="pool-row">' +
        '<span class="pair">' + esc(pool.pairSymbol) + '</span>' +
        '<span class="num">TVL ' + (compactUsd(pool.tvlUsd) || '—') + '</span>' +
        '<span class="num">24h ' + (compactUsd(pool.volume24hUsd) || '—') + '</span>' +
      '</div>').join('') +
    '</div></details>';
}

function row(p) {
  const q = p.quality;
  const flagged = !q.priceReliable;
  const dev = pct(p.deviationPct);
  const devCls = dev === null ? '' : flagged ? 'untrusted' : (p.deviationPct >= 0 ? 'up' : 'down');

  const status = flagged
    ? '<span class="badge flag">' + ICON.warn + 'FLAGGED</span>'
    : '<span class="badge ok">' + ICON.ok + 'RELIABLE</span>';

  return '<tr' + (flagged ? ' class="flagged"' : '') + '>' +
    '<td><div class="sym">' + esc(p.symbol) + '</div><div class="iss">' + esc(p.issuer) + '</div></td>' +
    '<td><span class="iss">' + esc(p.chain) + '</span></td>' +
    '<td class="r num">' + (usd(p.priceUsd) || nullCell('no usable on-chain price')) + '</td>' +
    '<td class="r num">' + (usd(p.referencePriceUsd) || nullCell('no reference price available')) + '</td>' +
    '<td class="r num ' + devCls + '" style="font-weight:600">' +
      (dev === null ? nullCell('deviation needs both prices') : esc(dev)) + '</td>' +
    '<td class="r num">' + (compactUsd(p.poolTvlUsd) || nullCell('unavailable')) + '</td>' +
    '<td class="r num">' + (compactUsd(p.volume24hUsd) || nullCell('unavailable')) + '</td>' +
    '<td>' + status + flagList(q.caveats) + '</td>' +
  '</tr>';
}

/* --- boot ---------------------------------------------------------------- */

el('refresh').addEventListener('click', () => load(ticker));
loadTickers();
load(ticker);
</script>
</body>
</html>
